[package]
name = "wrkrs"
description = "Modern HTTP benchmarking tool, a Rust port of wrk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
authors = ["Emre Can Çorapçı <emrecancorapci@proton.me>"]
keywords = ["http", "benchmark", "load-testing", "wrk", "cli"]
categories = ["command-line-utilities", "network-programming", "development-tools::profiling"]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/wrkrs", dest = "/usr/bin/wrkrs", mode = "755" },
]

[features]
default = ["engine-luajit", "engine-quickjs"]
engine-luajit = ["dep:mlua", "mlua/luajit", "mlua/vendored", "mlua/send"]
engine-lua54 = ["dep:mlua", "mlua/lua54", "mlua/vendored", "mlua/send"]
engine-quickjs = ["dep:rquickjs"]
engine-stub = []

[dependencies]
httparse = "1.10.1"
libc = "0.2.189"
mio = { version = "1.2.3", features = ["net", "os-poll"] }
mlua = { version = "0.12.1", default-features = false, optional = true }
rquickjs = { version = "=0.14.0", optional = true, features = ["parallel", "classes", "macro"] }
rustls = { version = "0.23.45", default-features = false, features = ["std", "ring", "tls12"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = "2.0.20"
toml = { workspace = true }
wrkrs-engine.workspace = true

[dev-dependencies]
rcgen = "0.14.10"
wrkrs-engine-tests = { path = "../wrkrs-engine-tests" }

[lints]
workspace = true
