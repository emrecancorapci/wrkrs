[package]
name = "wrkrs"
description = "Modern HTTP benchmarking tool, a Rust port of wrk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["engine-luajit", "engine-quickjs"]
engine-luajit = ["dep:mlua", "mlua/luajit", "mlua/vendored", "mlua/send"]
engine-lua54 = ["dep:mlua", "mlua/lua54", "mlua/vendored", "mlua/send"]
engine-quickjs = []
engine-stub = []

[dependencies]
mlua = { version = "0.12.1", default-features = false, optional = true }
thiserror = "2.0.20"
wrkrs-engine.workspace = true

[lints]
workspace = true
