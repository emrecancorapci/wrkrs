name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  RUSTFLAGS: -D warnings
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: default, features: "" }
          - { name: lua-quickjs, features: "--no-default-features --features engine-lua54,engine-quickjs" }
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: Swatinem/rust-cache@v2
        with:
          key: lint-${{ matrix.name }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: just lint "${{ matrix.features }}"

  rust:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        # the cross product runs every feature set on every os
        features:
          - { name: default, flags: "" }
          - { name: lua-quickjs, flags: "--no-default-features --features engine-lua54,engine-quickjs" }
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.features.name }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: just test "${{ matrix.features.flags }}"

  ci:
    if: always()
    needs: [lint, rust]
    runs-on: ubuntu-latest
    steps:
      - run: |
          [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "false" ]
